<svg xmlns="http://www.w3.org/2000/svg" width="640" height="540" viewBox="0 0 640 540">
  <style>
    text { font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #222; font-size: 15px; }
    .title { font-size: 20px; font-weight: 600; }
    .caption { font-size: 14px; fill: #555; }
    .point { fill: #6741d9; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="639" height="539" rx="16" fill="#fbfaf6" stroke="#e4e1d8"/>
  <text class="title" x="32" y="42">World coordinates</text>

  <!-- the unit square -->
  <rect x="160" y="90" width="320" height="320" fill="#ffffff" stroke="#b8b4aa" stroke-width="1.5"/>

  <!-- axes from the origin (top-left) -->
  <line x1="160" y1="90" x2="540" y2="90" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="160" y1="90" x2="160" y2="460" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="550" y="95">+x (east)</text>
  <text x="160" y="484" text-anchor="middle">+y (south)</text>

  <!-- origin and corners -->
  <circle cx="160" cy="90" r="5" fill="#222"/>
  <text x="148" y="80" text-anchor="end" font-weight="600">(0, 0)</text>
  <text x="480" y="80" text-anchor="middle">(1, 0)</text>
  <text x="148" y="415" text-anchor="end">(0, 1)</text>
  <text x="490" y="428">(1, 1)</text>

  <!-- center -->
  <circle cx="320" cy="250" r="4.5" class="point"/>
  <text x="330" y="244" class="point">(0.5, 0.5)</text>

  <text class="caption" x="32" y="520">The whole Web Mercator world as a unit square. Zoom-independent.</text>
</svg>
