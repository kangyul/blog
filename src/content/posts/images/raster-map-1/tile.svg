<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540">
  <style>
    text { font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #222; font-size: 15px; }
    .title { font-size: 20px; font-weight: 600; }
    .sub { font-size: 15px; font-weight: 600; fill: #333; }
    .cell { font-size: 15px; font-weight: 600; fill: #666; }
    .hl { fill: #1f5fa8; }
    .caption { font-size: 14px; fill: #555; }
    .point { fill: #6741d9; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="539" rx="16" fill="#fbfaf6" stroke="#e4e1d8"/>
  <text class="title" x="32" y="42">Tile coordinates</text>

  <!-- LEFT: the world square cut into 2 x 2 tiles at z = 1 -->
  <text class="sub" x="90" y="76">Tile id x/y at zoom z = 1</text>
  <text x="160" y="102" text-anchor="middle">x = 0</text>
  <text x="300" y="102" text-anchor="middle">x = 1</text>
  <text x="80" y="186" text-anchor="end">y = 0</text>
  <text x="80" y="326" text-anchor="end">y = 1</text>

  <rect x="90" y="110" width="280" height="280" fill="#ffffff" stroke="#b8b4aa" stroke-width="1.5"/>
  <rect x="230" y="110" width="140" height="140" fill="#dbe8f7" stroke="#1f5fa8" stroke-width="2"/>
  <line x1="230" y1="110" x2="230" y2="390" stroke="#b8b4aa" stroke-width="1.5"/>
  <line x1="90" y1="250" x2="370" y2="250" stroke="#b8b4aa" stroke-width="1.5"/>
  <rect x="230" y="110" width="140" height="140" fill="none" stroke="#1f5fa8" stroke-width="2"/>

  <text class="cell" x="100" y="132">0/0</text>
  <text class="cell hl" x="240" y="132">1/0</text>
  <text class="cell" x="100" y="272">0/1</text>
  <text class="cell" x="240" y="272">1/1</text>

  <circle cx="300" cy="180" r="5" class="point"/>
  <text x="300" y="206" text-anchor="middle" font-size="13" class="point">world (0.75, 0.25)</text>

  <!-- zoom-in guides -->
  <line x1="370" y1="110" x2="500" y2="110" stroke="#1f5fa8" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.6"/>
  <line x1="370" y1="250" x2="500" y2="390" stroke="#1f5fa8" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.6"/>

  <!-- RIGHT: tile 1/0 enlarged, tile-local (u, v) -->
  <text class="sub" x="500" y="76">Tile-local (u, v) inside tile 1/0</text>
  <rect x="500" y="110" width="280" height="280" fill="#dbe8f7" stroke="#1f5fa8" stroke-width="2"/>

  <line x1="500" y1="110" x2="815" y2="110" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="110" x2="500" y2="425" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="824" y="115">+u</text>
  <text x="500" y="447" text-anchor="middle">+v</text>

  <circle cx="500" cy="110" r="5" fill="#222"/>
  <text x="490" y="100" text-anchor="end" font-weight="600">(0, 0)</text>
  <text x="780" y="100" text-anchor="middle">(1, 0)</text>
  <text x="490" y="414" text-anchor="end">(0, 1)</text>
  <text x="790" y="408">(1, 1)</text>

  <circle cx="640" cy="250" r="5" class="point"/>
  <text x="640" y="276" text-anchor="middle" class="point">(u, v) = (0.5, 0.5)</text>

  <text class="caption" x="32" y="490">Tile id says which tile: integers 0 … 2<tspan dy="-6" font-size="10">z</tspan><tspan dy="6"> − 1 on each axis. Tile-local (u, v) says where inside it, 0 … 1.</tspan></text>
  <text class="caption" x="32" y="514">Same point, two descriptions: world = (x + u) / 2<tspan dy="-6" font-size="10">z</tspan><tspan dy="6"> = (1 + 0.5) / 2 = 0.75.</tspan></text>
</svg>
