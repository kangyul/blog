<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560">
  <style>
    text { font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #222; font-size: 14px; }
    .title { font-size: 20px; font-weight: 600; }
    .dim { fill: #666; }
    .caption { font-size: 14px; fill: #555; }
    .accent { fill: #d9480f; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="639" height="559" rx="16" fill="#fbfaf6" stroke="#e4e1d8"/>
  <text class="title" x="32" y="42">NDC (Normalized Device Coordinates)</text>

  <!-- the same 4:3 window: NDC stretches to fit it -->
  <rect x="120" y="120" width="400" height="300" fill="#ffffff" stroke="#b8b4aa" stroke-width="1.5"/>

  <!-- negative half-axes, dashed -->
  <line x1="120" y1="270" x2="320" y2="270" stroke="#999" stroke-width="1.2" stroke-dasharray="5 5"/>
  <line x1="320" y1="270" x2="320" y2="420" stroke="#999" stroke-width="1.2" stroke-dasharray="5 5"/>

  <!-- axes from the center; y points UP -->
  <line x1="320" y1="270" x2="560" y2="270" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="270" x2="320" y2="80" stroke="#d9480f" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <text x="570" y="275" font-size="15">+x</text>
  <text x="332" y="90" font-size="15" font-weight="600" class="accent">+y</text>

  <!-- origin -->
  <circle cx="320" cy="270" r="5" fill="#222"/>
  <text x="310" y="292" text-anchor="end" font-weight="600">(0, 0)</text>

  <!-- corners -->
  <circle cx="120" cy="120" r="3" fill="#444"/>
  <circle cx="520" cy="120" r="3" fill="#444"/>
  <circle cx="120" cy="420" r="3" fill="#444"/>
  <circle cx="520" cy="420" r="3" fill="#444"/>
  <text x="112" y="112" text-anchor="end">(−1, 1)</text>
  <text x="528" y="112">(1, 1)</text>
  <text x="112" y="438" text-anchor="end">(−1, −1)</text>
  <text x="528" y="438">(1, −1)</text>

  <text class="caption" x="32" y="516">What OpenGL expects in gl_Position. Both axes run −1 … 1, whatever the window's shape.</text>
  <text class="caption accent" x="32" y="538">The only space in the pipeline where y grows upward.</text>
</svg>
